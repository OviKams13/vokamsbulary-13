# CI (2.12): lint, typecheck, format check and production build on every PR.
# The job name "Lint, typecheck, build" is the status check that `main`'s
# branch protection requires.
name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      # `next build` loads every server module to collect page config, and
      # `src/lib/env.ts` validates when it is loaded. These placeholders only
      # satisfy the schema: nothing connects to a database or calls an API
      # during the build. They are not secrets.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          ANTHROPIC_API_KEY: ci-placeholder
          ACCESS_CODE: ci-placeholder
          ACCESS_COOKIE_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
